basePath: /
definitions:
  dto.ChangePassword:
    properties:
      currentPassword:
        type: string
      newPassword:
        minLength: 8
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  dto.ErrorResponse:
    properties:
      message:
        example: error
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.Login:
    properties:
      email:
        example: alfan@gmail.com
        type: string
      password:
        example: alfan123
        type: string
    required:
    - email
    - password
    type: object
  dto.Register:
    properties:
      email:
        type: string
      fullname:
        minLength: 5
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - fullname
    - password
    type: object
  dto.RequestForgotPassword:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPassword:
    properties:
      id:
        type: integer
      newPassword:
        minLength: 8
        type: string
    required:
    - id
    - newPassword
    type: object
  dto.Response:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.SetTestimony:
    properties:
      message:
        type: string
    required:
    - message
    type: object
host: localhost:9000
